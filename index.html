<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Finance Tracker</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finance Log">

  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --accent: #30d158;
      --danger: #ff453a;
      --warning: #ffd60a;
      --text: #f5f5f7;
      --subtext: #a1a1a6;
      --border: #2c2c2e;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      padding-bottom: 50px;
    }
    h1, h2 { text-align: center; margin-bottom: 12px; font-size: 1.2rem; }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }
    .balance-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    .account-box {
      background: #2c2c2e;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .account-title { font-size: 0.75rem; color: var(--subtext); }
    .account-val { font-size: 1rem; font-weight: bold; margin-top: 4px; }
    
    .nav-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px 4px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--subtext);
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    label { display: block; font-size: 0.8rem; color: var(--subtext); margin-top: 8px; }
    input, select, textarea {
      width: 100%;
      background: #2c2c2e;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px;
      border-radius: 8px;
      box-sizing: border-box;
      margin-top: 4px;
      font-size: 0.95rem;
    }
    button.submit-btn {
      width: 100%;
      background: var(--accent);
      color: #000;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      margin-top: 12px;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding: 10px 0;
    }
    .item-row:last-child { border-bottom: none; }
    .item-desc { font-size: 0.9rem; font-weight: 600; }
    .item-meta { font-size: 0.75rem; color: var(--subtext); }
    .amount-expense { color: var(--danger); font-weight: bold; }
    .amount-income { color: var(--accent); font-weight: bold; }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: bold;
      margin-left: 4px;
    }
    .badge-borrow { background: #3a2323; color: var(--danger); }
    .badge-lend { background: #1c3322; color: var(--accent); }
  </style>
</head>
<body>

  <h1>💰 Personal Finance Tracker</h1>

  <!-- ACCOUNTS & BALANCES -->
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2 style="margin:0;">Bank Balances</h2>
      <button onclick="editBalances()" style="background:transparent; border:none; color:var(--accent); font-size:0.8rem; cursor:pointer;">⚙️ Edit Initial</button>
    </div>
    
    <div class="balance-grid">
      <div class="account-box">
        <div class="account-title">Federal Bank NRE</div>
        <div class="account-val" id="balNre">₹0</div>
      </div>
      <div class="account-box">
        <div class="account-title">Federal Bank NRO</div>
        <div class="account-val" id="balNro">₹0</div>
      </div>
      <div class="account-box">
        <div class="account-title">Revolut (Hungary)</div>
        <div class="account-val" id="balRevolut">0 Ft</div>
      </div>
      <div class="account-box">
        <div class="account-title">MBH (Hungary)</div>
        <div class="account-val" id="balMbh">0 Ft</div>
      </div>
    </div>
  </div>

  <!-- NAVIGATION TABS -->
  <div class="nav-tabs">
    <button class="tab-btn active" id="tabExpenseBtn" onclick="switchTab('expense')">Spends & Income</button>
    <button class="tab-btn" id="tabDebtBtn" onclick="switchTab('debt')">Borrowed / Lent</button>
  </div>

  <!-- TAB 1: SPENDS & INCOME -->
  <div id="tabExpense">
    <div class="card">
      <h2>Log Transaction</h2>
      <form id="txForm">
        <label>Type</label>
        <select id="txType" onchange="adjustCategories()">
          <option value="Expense">Expense (Spend)</option>
          <option value="Income">Income (Received)</option>
        </select>

        <label>Account</label>
        <select id="txAccount">
          <option value="revolut">Revolut (HUF)</option>
          <option value="mbh">MBH Bank (HUF)</option>
          <option value="nre">Federal Bank NRE (INR)</option>
          <option value="nro">Federal Bank NRO (INR)</option>
        </select>

        <label>Amount</label>
        <input type="number" step="any" id="txAmount" placeholder="e.g. 5000" required>

        <label>Category / Note</label>
        <input type="text" id="txNote" placeholder="e.g. Groceries, Fuel, Remittance" required>

        <button type="submit" class="submit-btn">Save Transaction</button>
      </form>
    </div>

    <div class="card">
      <h2>Transaction History</h2>
      <div id="txList"></div>
    </div>
  </div>

  <!-- TAB 2: DEBT / BORROWED & LENT -->
  <div id="tabDebt" style="display: none;">
    <div class="card">
      <h2>Log Borrowed or Lent Money</h2>
      <form id="debtForm">
        <label>Type</label>
        <select id="debtType">
          <option value="Borrowed">I Borrowed Money (I owe someone)</option>
          <option value="Lent">I Lent Money (Someone owes me)</option>
        </select>

        <label>Person Name</label>
        <input type="text" id="debtPerson" placeholder="e.g. Alex" required>

        <label>Currency & Amount</label>
        <div style="display: flex; gap: 8px;">
          <select id="debtCurrency" style="width: 35%;">
            <option value="HUF">HUF (Ft)</option>
            <option value="INR">INR (₹)</option>
          </select>
          <input type="number" step="any" id="debtAmount" placeholder="Amount" required style="width: 65%;">
        </div>

        <label>Note / Reason</label>
        <input type="text" id="debtNote" placeholder="e.g. Dinner share, Emergency cash">

        <button type="submit" class="submit-btn" style="background: var(--warning);">Add Record</button>
      </form>
    </div>

    <div class="card">
      <h2>Pending Debt Ledger</h2>
      <div id="debtList"></div>
    </div>
  </div>

  <script>
    // --- INITIAL DATA & BALANCES ---
    let balances = JSON.parse(localStorage.getItem('fin_balances') || JSON.stringify({
      nre: 0,
      nro: 0,
      revolut: 0,
      mbh: 0
    }));

    function saveBalances() {
      localStorage.setItem('fin_balances', JSON.stringify(balances));
      renderBalances();
    }

    function renderBalances() {
      document.getElementById('balNre').innerText = `₹${Number(balances.nre).toLocaleString()}`;
      document.getElementById('balNro').innerText = `₹${Number(balances.nro).toLocaleString()}`;
      document.getElementById('balRevolut').innerText = `${Number(balances.revolut).toLocaleString()} Ft`;
      document.getElementById('balMbh').innerText = `${Number(balances.mbh).toLocaleString()} Ft`;
    }

    function editBalances() {
      const nre = prompt("Federal Bank NRE Balance (INR):", balances.nre);
      const nro = prompt("Federal Bank NRO Balance (INR):", balances.nro);
      const revolut = prompt("Revolut Balance (HUF):", balances.revolut);
      const mbh = prompt("MBH Balance (HUF):", balances.mbh);

      if (nre !== null) balances.nre = parseFloat(nre) || 0;
      if (nro !== null) balances.nro = parseFloat(nro) || 0;
      if (revolut !== null) balances.revolut = parseFloat(revolut) || 0;
      if (mbh !== null) balances.mbh = parseFloat(mbh) || 0;

      saveBalances();
    }

    // --- TABS ---
    function switchTab(tab) {
      document.getElementById('tabExpense').style.display = tab === 'expense' ? 'block' : 'none';
      document.getElementById('tabDebt').style.display = tab === 'debt' ? 'block' : 'none';

      document.getElementById('tabExpenseBtn').className = `tab-btn ${tab === 'expense' ? 'active' : ''}`;
      document.getElementById('tabDebtBtn').className = `tab-btn ${tab === 'debt' ? 'active' : ''}`;
    }

    // --- TRANSACTIONS ---
    document.getElementById('txForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const type = document.getElementById('txType').value;
      const account = document.getElementById('txAccount').value;
      const amount = parseFloat(document.getElementById('txAmount').value);
      const note = document.getElementById('txNote').value.trim();

      if (isNaN(amount) || amount <= 0) return;

      // Update Balance
      if (type === 'Expense') {
        balances[account] -= amount;
      } else {
        balances[account] += amount;
      }
      saveBalances();

      const tx = {
        id: Date.now(),
        type,
        account,
        amount,
        note,
        timestamp: new Date().toLocaleString()
      };

      const history = JSON.parse(localStorage.getItem('fin_tx_history') || '[]');
      history.unshift(tx);
      localStorage.setItem('fin_tx_history', JSON.stringify(history));

      document.getElementById('txAmount').value = '';
      document.getElementById('txNote').value = '';
      renderTxHistory();
    });

    function renderTxHistory() {
      const history = JSON.parse(localStorage.getItem('fin_tx_history') || '[]');
      const container = document.getElementById('txList');

      if (history.length === 0) {
        container.innerHTML = `<p style="color:var(--subtext); font-size:0.85rem;">No transactions recorded yet.</p>`;
        return;
      }

      const accLabels = { revolut: 'Revolut (HUF)', mbh: 'MBH (HUF)', nre: 'NRE (INR)', nro: 'NRO (INR)' };

      container.innerHTML = history.map(t => {
        const symbol = (t.account === 'nre' || t.account === 'nro') ? '₹' : 'Ft';
        const isExp = t.type === 'Expense';
        return `
          <div class="item-row">
            <div>
              <div class="item-desc">${t.note}</div>
              <div class="item-meta">${accLabels[t.account]} | ${t.timestamp}</div>
            </div>
            <div class="${isExp ? 'amount-expense' : 'amount-income'}">
              ${isExp ? '-' : '+'}${t.amount.toLocaleString()} ${symbol}
            </div>
          </div>
        `;
      }).join('');
    }

    // --- DEBT / BORROWED & LENT ---
    document.getElementById('debtForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const type = document.getElementById('debtType').value;
      const person = document.getElementById('debtPerson').value.trim();
      const curr = document.getElementById('debtCurrency').value;
      const amount = parseFloat(document.getElementById('debtAmount').value);
      const note = document.getElementById('debtNote').value.trim();

      if (!person || isNaN(amount) || amount <= 0) return;

      const debt = {
        id: Date.now(),
        type,
        person,
        curr,
        amount,
        note,
        settled: false,
        timestamp: new Date().toLocaleString()
      };

      const debts = JSON.parse(localStorage.getItem('fin_debts') || '[]');
      debts.unshift(debt);
      localStorage.setItem('fin_debts', JSON.stringify(debts));

      document.getElementById('debtPerson').value = '';
      document.getElementById('debtAmount').value = '';
      document.getElementById('debtNote').value = '';
      renderDebts();
    });

    function toggleDebt(id) {
      let debts = JSON.parse(localStorage.getItem('fin_debts') || '[]');
      debts = debts.map(d => {
        if (d.id === id) d.settled = !d.settled;
        return d;
      });
      localStorage.setItem('fin_debts', JSON.stringify(debts));
      renderDebts();
    }

    function renderDebts() {
      const debts = JSON.parse(localStorage.getItem('fin_debts') || '[]');
      const container = document.getElementById('debtList');

      if (debts.length === 0) {
        container.innerHTML = `<p style="color:var(--subtext); font-size:0.85rem;">No pending debts or loans.</p>`;
        return;
      }

      container.innerHTML = debts.map(d => {
        const isBorrow = d.type === 'Borrowed';
        const symbol = d.curr === 'INR' ? '₹' : 'Ft';
        return `
          <div class="item-row" style="opacity: ${d.settled ? '0.4' : '1'}">
            <div>
              <div class="item-desc">${d.person} 
                <span class="badge ${isBorrow ? 'badge-borrow' : 'badge-lend'}">${d.type}</span>
              </div>
              <div class="item-meta">${d.note ? d.note + ' | ' : ''}${d.timestamp}</div>
            </div>
            <div style="text-align:right;">
              <div class="${isBorrow ? 'amount-expense' : 'amount-income'}">
                ${d.amount.toLocaleString()} ${symbol}
              </div>
              <button onclick="toggleDebt(${d.id})" style="background:transparent; border:none; color:var(--accent); font-size:0.75rem; cursor:pointer;">
                ${d.settled ? 'Mark Unpaid' : 'Mark Settled'}
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    renderBalances();
    renderTxHistory();
    renderDebts();
  </script>
</body>
</html>
